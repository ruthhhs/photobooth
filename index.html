<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
</head>
<body>
    <div id="wrapper">
        <div id="pages">
            <div id="camera-page" class="page">
                <div class="container">
                    <h1 id="comment">Smile sweetheart <3</h1>
                    <video id="video" autoplay inline></video>
                    <div id="control">
                        <p id="countdown"></p>
                        <button id="capture-btn" class="btn">Take photo</button>
                    </div>
                </div>
            </div>
    
            <div id="costumize-page" class="page">
                <div class="container">
                    <button id="back-btn" class="btn">Back</button>
    
                    <p class="fr-title">Base colour</p>
                    <div id="base-fr" class="fr-pick">
                        <input id="pickColor" type="color" value="#f6f7f2"/>
                    </div>
    
                    <p class="fr-title">Templates frame</p>
                    <div id="templates-fr" class="fr-pick">
                        <button class="template"><img src=""/></button>
                        <button class="template"><img src=""/></button>
                        <button class="template"><img src=""/></button>
                    </div>
    
                    <button id="download-btn" class="btn">Download here !</button>
                </div>
            </div>
        </div>

        <div class="fixed">
            <div id="photo-container">
                <div id="photo-list">
                    <img class="photo" src="./assets/noimg.png"/>
                    <img class="photo" src="./assets/noimg.png"/>
                    <img class="photo" src="./assets/noimg.png"/>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
