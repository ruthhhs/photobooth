<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
</head>
<body>
    <div class="photobooth-container row">
        <div class="camera-container col">
            <h2 class="title">Smile sweetheart <3</h2>
            <video id="video" autoplay inline></video>
            <div id="control" class="row">
                <button id="capture-btn" class="btn">Capture</button>
            </div>
        </div>

        <div id="photo-container">
            <div id="photo-list"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
